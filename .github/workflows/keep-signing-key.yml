# 빌드 캐시는 7일 동안 쓰이지 않으면 지워집니다.
# 앱 서명 키가 지워지지 않도록 매주 한 번 불러오기만 합니다.
name: 앱 서명 키 보관 유지

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.stec-signing
          key: stec-signing-v1
      - run: ls -la ~/.stec-signing 2>/dev/null || echo "아직 보관된 키가 없습니다"
