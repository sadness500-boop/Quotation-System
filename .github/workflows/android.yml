# 안드로이드 앱(APK) 자동 만들기
# index.html 이나 mobile 폴더가 바뀌면 GitHub 서버가 앱을 새로 만들어
# "android-latest" 릴리스에 S-Tec-Quotation.apk 로 올립니다.
name: Android 앱 만들기

on:
  push:
    branches: [main]
    paths: ["index.html", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 버전 정하기
        id: ver
        run: |
          f=$(ls 에스텍_용역인력_견적시스템_v*.html | head -1)
          v=$(echo "$f" | sed -E 's/.*_v([0-9.]+)\.html/\1/')
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"

      - name: 웹 앱을 안드로이드 프로젝트로 복사
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node prep.js
          npx cap sync android

      # 서명 키: 저장소에는 넣지 않습니다.
      # ① GitHub 비밀값(STEC_KEYSTORE_B64 등)이 있으면 그 키, ② 없으면 GitHub 빌드 캐시에 보관된 키를 씁니다.
      #    같은 키로 서명해야 새 버전이 기존 앱 위에 덮어 설치됩니다.
      - name: 보관된 서명 키 불러오기
        uses: actions/cache@v4
        with:
          path: ~/.stec-signing
          key: stec-signing-v1

      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.STEC_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.STEC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.STEC_KEY_ALIAS }}
          KS_KPW: ${{ secrets.STEC_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/stec.keystore"
            { echo "STEC_KEYSTORE=$RUNNER_TEMP/stec.keystore"; echo "STEC_KEYSTORE_PASSWORD=$KS_PW"; echo "STEC_KEY_ALIAS=$KS_ALIAS"; echo "STEC_KEY_PASSWORD=$KS_KPW"; } >> "$GITHUB_ENV"
            echo "GitHub 비밀값의 서명 키를 사용합니다"
          else
            d="$HOME/.stec-signing"; mkdir -p "$d"
            if [ ! -f "$d/stec.keystore" ]; then
              pw=$(openssl rand -hex 16); echo "$pw" > "$d/pw"
              keytool -genkeypair -keystore "$d/stec.keystore" -alias stec -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$pw" -keypass "$pw" -dname "CN=S-Tec Best East Branch, O=S-Tec Best, C=KR" >/dev/null
              echo "::notice::새 서명 키를 만들어 빌드 캐시에 보관했습니다"
            fi
            pw=$(cat "$d/pw"); echo "::add-mask::$pw"
            { echo "STEC_KEYSTORE=$d/stec.keystore"; echo "STEC_KEYSTORE_PASSWORD=$pw"; echo "STEC_KEY_ALIAS=stec"; echo "STEC_KEY_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          fi

      - name: APK 만들기
        working-directory: mobile/android
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          st=${PIPESTATUS[0]}; set -e
          if [ "$st" != "0" ]; then
            msg=$(grep -E -A12 "What went wrong|^e: |error:|FAILED" "$RUNNER_TEMP/gradle.log" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=APK 만들기 실패::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/S-Tec-Quotation.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: S-Tec-Quotation-apk
          path: S-Tec-Quotation.apk

      - name: 릴리스에 올리기 (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          notes="S-Tec Quotation System v$V 안드로이드 앱 (빌드 ${{ steps.ver.outputs.code }}, $(date -u +%Y-%m-%d)). 휴대폰에서 S-Tec-Quotation.apk 를 눌러 설치하세요."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest S-Tec-Quotation.apk --clobber
            gh release edit android-latest --title "안드로이드 앱 v$V" --notes "$notes" --latest
          else
            gh release create android-latest S-Tec-Quotation.apk --title "안드로이드 앱 v$V" --notes "$notes" --latest
          fi
